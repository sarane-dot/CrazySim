crazyflie_server:
  ros__parameters:
    warnings:
      frequency: 1.0
      motion_capture:
        warning_if_rate_outside: [80.0, 120.0]
      communication:
        max_unicast_latency: 10.0
        min_unicast_ack_rate: 0.9
        min_unicast_receive_rate: 0.9
        min_broadcast_receive_rate: 0.9
        min_broadcast_ack_rate: 0.9

    all:
      firmware_params:
        commander:
          enHighLevel: 1
        stabilizer:
          estimator: 2
          controller: 1
        ring:
          effect: 16
          solidBlue: 255
          solidGreen: 0
          solidRed: 0
          headlightEnable: 0

      # Telemetry logging definitions
      firmware_logging:
        enabled: true
        default_topics:
          pose:
            frequency: 10
          status:
            frequency: 1
