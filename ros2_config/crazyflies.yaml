robots:
  cf0:
    enabled: true
    uri: "udp://127.0.0.1:19850"
    initial_position: [0.0, 0.0, 0.0]
    type: cf2

robot_types:
  cf2:
    motion_capture:
      enabled: false
      type: "none"
      marker: "default"
      dynamics: "default"
    firmware_logging:
      enabled: true
      default_topics:
        pose:
          frequency: 10
        status:
          frequency: 1
